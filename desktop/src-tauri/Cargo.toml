[package]
name = "fnf-agent-desktop"
version = "4.1.0"
description = "Cápsula de escritorio FNF-Agent: sirve web/ y arranca el relay local"
authors = ["FNF-Agent contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "fnf_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tiny_http = "0.12"
mime_guess = "2"
rand = "0.8"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
