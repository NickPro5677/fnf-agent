name: CI

on:
  push:
    branches: [main, v4]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install pytest pillow
          npx playwright install --with-deps chromium
      - name: Todas las pruebas (JS, Python, legacy, e2e)
        run: bash check.sh
      - name: Subir reportes si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
